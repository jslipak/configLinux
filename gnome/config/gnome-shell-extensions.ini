[copyous]
database-backend='json'
disable-hljs-dialog=false
incognito=false

[extension-list]
enable-filter=true

[focus-changer]
focus-down=['<Alt><Super>j']
focus-left=['<Alt><Super>h']
focus-right=['<Alt><Super>l']
focus-up=['<Alt><Super>k']

[hotedge]
fallback-in-use=false

[pomodoro-timer]
session-completed-intervals=0
session-interval-type='work'
session-remaining-time=1500
session-state='idle'
